<style>
/* Paper-desk portfolio: objects (stack, binder, magazine, folder, film strip) laid on one warm paper ground.
   Single light look by design: everything is printed paper. */
:root{
  --ground:#E7E4DE; --paper:#F2EFE9; --leaf:#EEEAE3; --ink:#1D1C1A; --mute:#7A766F; --line:#B9B4AB;
  --ui:'Geist','Helvetica Neue',Arial,sans-serif; --tw:'Courier Prime','Courier New',monospace; --sig:'Mrs Saint Delafield','Snell Roundhand',cursive;
  --hdr:64px; --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
@media (min-width:900px){:root{--gl:max(40px,env(safe-area-inset-left,0px));--gr:max(40px,env(safe-area-inset-right,0px))}}
[hidden]{display:none!important}
html,body{height:100%}
html,body{background:var(--ground);color:var(--ink)}
body{margin:0;font-family:var(--ui);overflow:hidden;background:var(--ground) url(m/tex/bgsmooth.jpg) center/cover}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img,video{display:block;max-width:none}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.caps{font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.4}
/* MOBILE type system: two fonts (script + Courier), one caps style */
@media (max-width:760px){
  :root{--ui:'Courier Prime','Courier New',monospace;--cap:12px;--capt:.18em}
  .caps{font-family:var(--tw);font-weight:400;font-size:var(--cap);letter-spacing:var(--capt);line-height:1.5}
  .count{font-weight:400;font-size:var(--cap);letter-spacing:var(--capt)}
}
.tw{font-family:var(--tw);color:#2a2926}
.sig{font-family:var(--sig);font-weight:400;line-height:1;color:var(--ink)}
.home-cap .sig,.swipe-hint .sig,.film-info .sig,.film-mob .sig{display:inline-block;padding:.22em .45em;margin:-.22em -.45em}
@media (max-width:760px){.home-hint .sig{display:inline-block;padding:.22em .45em;margin:-.22em -.45em}}
.mute{color:var(--mute)}

/* header */
.hdr{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:var(--hdr);z-index:50;display:flex;align-items:center;justify-content:space-between;padding-left:var(--gl);padding-right:var(--gr)}
.logo{font-family:var(--sig);font-size:40px;line-height:1;padding-top:6px}
.nav{display:flex;gap:26px;align-items:center}
.nav a{padding-block:8px}
.nav a.on{text-decoration:underline;text-underline-offset:4px}
.menu-btn{display:none;min-height:44px;padding:0 4px}
@media (max-width:760px){.nav .d{display:none}.menu-btn{display:block}.logo{font-size:34px}}
.sheetmenu{position:fixed;inset:0;z-index:45;background:var(--paper);padding:calc(var(--hdr) + 40px + env(safe-area-inset-top,0px)) var(--gr) 40px var(--gl);display:flex;flex-direction:column;gap:14px}
.sheetmenu a{font-family:var(--sig);font-size:58px;line-height:1.1}

main{position:fixed;left:0;right:0;top:calc(var(--hdr) + env(safe-area-inset-top,0px));bottom:env(safe-area-inset-bottom,0px)}
.view{position:absolute;inset:0}

/* ---------- HOME ---------- */
.home-list{position:absolute;left:var(--gl);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;z-index:3}
.home-list a{font-family:var(--tw);font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:5px 6px;display:flex;gap:12px;white-space:nowrap}
.home-list a .b{color:var(--mute)}
.home-list a.on{background:var(--ink);color:var(--paper)}
.home-list a.on .b{color:#bdb8ae}
.stack{position:absolute;left:50%;top:50%}
.print{position:absolute;left:0;top:0;background:#f7f5f0;padding:12px 12px 12px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 18px 34px rgba(0,0,0,.16);transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;will-change:transform}
.print img{width:100%;height:100%;object-fit:cover}
.print.lb img{object-fit:contain;background:#0d0d0d}
.home-cap{position:absolute;left:var(--gl);bottom:28px;text-align:left;max-width:360px}
.home-hint{position:absolute;right:calc(var(--gr) + 20px);bottom:16%;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;z-index:2}
.home-hint .sig{font-size:40px;margin-left:56px}
.home-hint img{width:150px;transform:scaleX(-1) rotate(-12deg);margin-top:-4px}
.home-cap .sig{font-size:64px}
.home-intro{position:absolute;right:var(--gr);top:24px;max-width:240px;text-align:right}
@media (max-width:760px){
  .home-list{display:none}
  .home-cap{left:var(--gl);right:var(--gr);bottom:22px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .home-cap .sig,.home-cap .caps{white-space:nowrap}
  .home-cap .sig{font-size:50px}
  .home-intro{display:none}
  .home-hint{right:var(--gr);bottom:auto;flex-direction:column-reverse;align-items:flex-end}.home-hint .sig{font-size:24px;margin-left:0;margin-top:-2px}.home-hint img{width:44px;transform:rotate(-140deg);align-self:flex-start;margin:22px 0 16px -6px}
  .home-swipe{display:flex}
}

/* ---------- SCENES (binder, magazine, folder) ---------- */
.scene{position:absolute;left:0;top:0;transform-origin:0 0;perspective:3200px}
.tex{position:absolute;pointer-events:none}
.page{position:absolute;overflow:hidden}
.leaf{position:absolute;transform-style:preserve-3d;z-index:20;pointer-events:none}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--leaf)}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none}
.ctl{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;align-items:center;gap:22px;z-index:30}
.arrow{width:46px;height:46px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(242,239,233,.7)}
.arrow:disabled{opacity:.3;cursor:default}
.count{display:flex;align-items:center;gap:12px;font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.08em;min-width:200px;justify-content:center}
.bar{width:120px;height:1px;background:var(--line);position:relative}.bar i{position:absolute;left:0;top:-.5px;height:2px;background:var(--ink);transition:width .4s}
.back{position:absolute;left:var(--gl);top:14px;z-index:30}
.next-hint{position:absolute;right:var(--gr);top:14px;z-index:30;text-align:right}

/* pieces inside pages */
.fr{position:absolute;cursor:zoom-in}
.fr img{width:100%;height:100%;object-fit:cover}
.mag .fr img{mix-blend-mode:multiply}
.tape{position:absolute;width:54px;height:18px;background:#1b1a19;opacity:.93;clip-path:polygon(2% 8%,98% 0,100% 30%,97% 60%,100% 100%,3% 94%,0 55%,3% 30%)}
.corner{position:absolute;width:26px;height:26px;background:#1d1c1a}
.corner.tl{left:-6px;top:-6px;clip-path:polygon(0 0,100% 0,0 100%)}
.corner.tr{right:-6px;top:-6px;clip-path:polygon(0 0,100% 0,100% 100%)}
.corner.bl{left:-6px;bottom:-6px;clip-path:polygon(0 0,0 100%,100% 100%)}
.corner.br{right:-6px;bottom:-6px;clip-path:polygon(100% 0,100% 100%,0 100%)}
.hole{position:absolute;width:18px;height:18px;border-radius:50%;background:#dcd8d1;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.card{position:absolute;box-sizing:border-box;background:#f6f4ef;padding:9px 9px 32px;box-shadow:0 1px 1px rgba(0,0,0,.1),0 7px 16px rgba(0,0,0,.14);cursor:pointer;transition:transform .3s}
.card:hover{transform:translateY(-3px) rotate(0deg)!important}
.card img{width:100%;height:100%;object-fit:cover}
.card .cp{position:absolute;left:10px;right:10px;bottom:9px;display:flex;justify-content:space-between;gap:8px;font-family:var(--ui);font-weight:500;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.card .cp span:last-child{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.tabs{position:absolute;display:flex;flex-direction:column;gap:10px;z-index:25}
.tab{width:112px;height:54px;background:#d9d4ca;border-radius:0 8px 8px 0;box-shadow:0 2px 4px rgba(0,0,0,.15);display:flex;align-items:center;padding-left:30px;font-family:var(--ui);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tab[aria-pressed="true"]{background:var(--ink);color:#f2efe9}
.mtabs{display:none}

/* ---------- FILM ---------- */
.film-wrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:40px;padding-left:var(--gl);padding-right:var(--gr)}
.film-info{align-self:center;max-width:420px;display:flex;flex-direction:column;gap:16px}
.film-info .sig{font-size:clamp(56px,6vw,92px)}
.film-info .tw{font-size:14px;line-height:1.6}
.watch{align-self:flex-start;min-height:44px;padding:0 22px;border-radius:999px;background:var(--ink);color:#f2efe9}
.film-list{align-self:center;justify-self:end;display:flex;flex-direction:column;gap:2px}
.film-list button{font-family:var(--tw);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:4px 6px;color:var(--mute)}
.film-list button.on{background:var(--ink);color:#f2efe9}
.strip-scroll{position:relative;height:100%;overflow-y:auto;scrollbar-width:none;scroll-snap-type:y mandatory}
.strip-scroll::-webkit-scrollbar{display:none}
.strip{display:flex;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.edge{position:relative;background:url(m/tex/filmbase.jpg) center top/100% auto repeat-y}
.edge .sp{position:absolute;left:50%;width:46%;transform:translateX(-50%);aspect-ratio:1/0.68;background:#f6f5f2;border:1px solid #9d9a95;border-radius:4px;box-sizing:border-box}
.edge .num{position:absolute;left:3px;font-family:var(--ui);font-weight:500;font-size:9px;letter-spacing:.14em;color:#2a2928;writing-mode:vertical-rl;white-space:nowrap}
.core{background:#141414;display:flex;flex-direction:column}
.ff{position:relative;flex:none;background:#050505;overflow:hidden;border-radius:3px;scroll-snap-align:center;cursor:pointer}
.ff img,.ff video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ff.lb img,.ff.lb video{object-fit:contain}
.ff .pl{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:rgba(245,243,238,.85);opacity:0;transition:opacity .3s}
.ff .pl::after{content:"";position:absolute;left:24px;top:19px;border-left:17px solid #1d1c1a;border-top:11px solid transparent;border-bottom:11px solid transparent}
.ff.cur .pl{opacity:1}
.ff:not(.cur){filter:brightness(.55)}
.film-mob{display:none}
@media (max-width:760px){
  .film-wrap{grid-template-columns:1fr;padding:0;gap:0}
  .film-info,.film-list{display:none}
  .strip-scroll{justify-self:center}
  .film-mob{display:flex;position:absolute;left:0;right:0;bottom:0;padding:40px var(--gr) 18px var(--gl);background:linear-gradient(rgba(231,228,222,0),rgba(231,228,222,.97) 40%);justify-content:space-between;align-items:flex-end;gap:12px;z-index:5}
  .film-mob .sig{font-size:44px}
}
/* projector */
.proj{position:fixed;inset:0;z-index:80;background:rgba(14,13,12,.9);display:flex;align-items:center;justify-content:center;animation:fade .35s ease}
.proj .strip{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.proj video{display:block;background:#000}
.proj .x{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;border:1px solid #f2efe9;color:#f2efe9;font-size:20px}
.proj .t{position:absolute;left:var(--gl);bottom:calc(20px + env(safe-area-inset-bottom,0px));color:#f2efe9}
.proj .t .sig{color:#f2efe9;font-size:46px}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* lightbox */
.lbx{position:fixed;inset:0;z-index:90;background:rgba(231,228,222,.97);display:flex;align-items:center;justify-content:center;animation:fade .25s ease}
.lbx img{max-width:calc(100vw - 140px);max-height:calc(100dvh - 120px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbx .x{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);font-size:20px}
.lbx .pv,.lbx .nx{position:absolute;top:50%;margin-top:-23px}
.lbx .pv{left:calc(16px + env(safe-area-inset-left,0px))}.lbx .nx{right:calc(16px + env(safe-area-inset-right,0px))}
@media (max-width:760px){.lbx img{max-width:calc(100vw - 24px)}.lbx .pv,.lbx .nx{top:auto;bottom:24px}}

.note-page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#f2efe9;padding:10px 16px;border-radius:999px;z-index:95;font-family:var(--ui);font-size:12px;letter-spacing:.04em;animation:fade .3s}
/* scroll pages (about, contact) */
.scrollv{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.col{max-width:1060px;margin:0 auto;padding:18px var(--gr) 80px var(--gl);display:flex;flex-direction:column;gap:56px}
.nbook{position:relative;background:#ECE9E2;padding:56px 56px 56px 150px;box-shadow:0 2px 3px rgba(0,0,0,.12),0 24px 46px rgba(0,0,0,.18);margin-left:30px}
.nbook::before{content:"";position:absolute;left:-30px;top:16px;bottom:16px;width:150px;background:url(m/tex/spiral.png) left top/150px auto repeat-y}
.polf{position:relative;background:#f6f5f1;padding:14px 14px 52px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 14px 30px rgba(0,0,0,.18)}
.polf img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.pclip{position:absolute;width:18px;height:40px;top:-18px;left:50%;margin-left:-9px;z-index:3;pointer-events:none;filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.28))}
.rec-sheet .pclip{width:30px;height:66px;top:-30px;margin-left:-15px}
.swipe-hint{position:absolute;left:0;right:0;top:62px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:30;pointer-events:none}
.swipe-hint img{width:58px}.swipe-hint img.l{transform:scaleX(-1)}
.swipe-hint .sig{font-size:30px}
@media (max-width:760px){.swipe-hint{top:34px}.swipe-hint .sig{font-size:24px}.swipe-hint img{width:40px}.back,.next-hint{display:none}.swipe-hint{top:8px}}
.about-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px;align-items:start}
.about-top .sig{font-size:clamp(56px,7vw,96px)}
.about-txt{font-family:var(--tw);font-size:15px;line-height:1.7;color:#2a2926;max-width:60ch}
.rec{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:40px;align-items:center}
.rec-pols{position:relative;height:520px}
.rec-sheet{position:relative;background:#f4f2ed;padding:52px 54px;box-shadow:0 2px 3px rgba(0,0,0,.12),0 22px 44px rgba(0,0,0,.18);transform:rotate(.8deg)}
.rec-sheet h2{margin:0;text-align:center;font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.rrow{display:flex;align-items:baseline;gap:10px}.rrow .n{font-family:var(--tw);font-size:30px}.rrow .d{flex:1;border-bottom:1.5px dotted #8b8882;transform:translateY(-5px)}
.scroll-hint{display:flex;align-items:center;gap:10px;align-self:flex-end;margin-top:-30px}
.scroll-hint img{height:120px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--ink);font-family:var(--ui);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:#f2efe9}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.fld label{font-family:var(--tw);font-size:14px}
.fld input,.fld textarea{font-family:var(--tw);font-size:16px;background:transparent;border:0;border-bottom:1px solid #6b6964;padding:8px 0;color:var(--ink);border-radius:0;outline:none}
.fld textarea{min-height:90px;resize:vertical}
.send{min-height:46px;padding:0 30px;border-radius:999px;background:var(--ink);color:#f2efe9;font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:760px){
  .nbook{padding:30px 22px 34px 84px;margin-left:12px}
  .nbook::before{left:-14px;width:96px;background-size:96px auto}
  .about-top,.rec{grid-template-columns:1fr;gap:30px}
  .rec-pols{height:min(132vw,520px);order:2;margin-bottom:10px}
  .rec-sheet{padding:34px 26px}
  .rrow .n{font-size:22px}
}


.home-swipe{display:none;position:absolute;left:0;right:0;top:12px;justify-content:center;align-items:center;gap:10px;pointer-events:none;z-index:2}
@media (max-width:760px){.home-swipe{display:flex}}
.home-swipe .sig{font-size:24px}
@media (max-width:760px){.home-hint .hh-a{content:url(m/tex/arrow3.png)}}.home-swipe img{width:34px}.home-swipe img.l{transform:scaleX(-1)}
/* smooth edges on rotated paper (iOS draws hard, stepped edges otherwise) */
@media (max-width:760px){.print,.mv-print,.polf,.card,.mv-mood div,.mv-next img{border:1px solid transparent;background-clip:padding-box;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.mv-print,.mv-mood div,.mv-next img{will-change:transform}}
/* ---------- MOBILE PROJECT (demo variants) ---------- */
.mv{background:transparent}
.mv-in{padding:14px 14px 120px;display:flex;flex-direction:column;align-items:center;gap:34px}
.mv-sheet{position:relative;width:100%;box-sizing:border-box;background:#ece8e1;box-shadow:0 2px 3px rgba(0,0,0,.1),0 18px 36px rgba(0,0,0,.14);padding:30px 22px 30px}
.mv-sheet.folder{background:#f1efea url(m/tex/sheetplain.jpg) center/cover;padding-left:40px}
.mv-sheet.folder .hole{left:12px}
.mv-sheet .sig.t{font-size:62px;margin:14px 0 4px}
.mv-tw{font-family:var(--tw);font-size:13px;line-height:1.6;color:#2a2926}
.mv-mood{display:flex;justify-content:center;gap:20px;margin-top:22px}
.mv-mood div{position:relative}
.mv-mood img{width:112px;height:140px;object-fit:cover;display:block;mix-blend-mode:multiply}
.mv-print{position:relative;box-sizing:border-box;background:#f7f5f0;padding:9px 9px 9px;box-shadow:0 1px 1px rgba(0,0,0,.12),0 14px 28px rgba(0,0,0,.16)}
.mv-print img{display:block;width:100%;height:auto;background:#e4e0d8}
.mv-print.pol{padding:10px 10px 40px}
.mv-print .cap{position:absolute;left:0;right:0;bottom:13px;text-align:center}

// justified layout: keeps every photo's own proportions, fits a box
function layout(ars,W,H,g){
  const n=ars.length; if(!n) return [];
  let best=null;
  for(let r=1;r<=n;r++){
    const rows=[];let i=0;for(let k=0;k<r;k++){const c=Math.round((n-i)/(r-k));rows.push(ars.slice(i,i+c).map((a,j)=>({a,idx:i+j})));i+=c}
    const hs=rows.map(row=>(W-g*(row.length-1))/row.reduce((s,o)=>s+o.a,0));
    const tot=hs.reduce((s,h)=>s+h,0)+g*(r-1);const sc=Math.min(1,H/tot);
    const area=rows.reduce((s,row,k)=>s+row.reduce((t,o)=>t+o.a*hs[k]*hs[k],0),0)*sc*sc;
    if(!best||area>best.area)best={area,rows,hs,sc,tot};
  }
  const out=[];const {rows,hs,sc,tot}=best;let y=(H-tot*sc)/2;
  rows.forEach((row,k)=>{const h=hs[k]*sc;const rw=row.reduce((s,o)=>s+o.a*h,0)+g*(row.length-1);let x=(W-rw)/2;row.forEach(o=>{out[o.idx]={x,y,w:o.a*h,h};x+=o.a*h+g});y+=h+g});
  return out;
}

/* cfg: {design:[W,H], pages:{L:[x,y,w,h],R:[x,y,w,h]}, spreads:[{L,R}], bg(scene), onEnd, onStart, cls, leafBg, label} */
function Book(view,cfg){
  const sc=document.createElement('div');sc.className='scene '+(cfg.cls||'');sc.style.width=cfg.design[0]+'px';sc.style.height=cfg.design[1]+'px';
  sc.innerHTML=cfg.bg;
  const [Lx,Ly,Lw,Lh]=cfg.pages.L,[Rx,Ry,Rw,Rh]=cfg.pages.R;
  const pl=document.createElement('div');pl.className='page L';Object.assign(pl.style,{left:Lx+'px',top:Ly+'px',width:Lw+'px',height:Lh+'px'});
  const pr=document.createElement('div');pr.className='page R';Object.assign(pr.style,{left:Rx+'px',top:Ry+'px',width:Rw+'px',height:Rh+'px'});
  sc.appendChild(pl);sc.appendChild(pr);
  (cfg.extra||[]).forEach(h=>sc.insertAdjacentHTML('beforeend',h));
  view.appendChild(sc);
  const ctl=document.createElement('div');ctl.className='ctl';ctl.innerHTML=`<button class="arrow" data-d="-1" aria-label="${T.prevPage}">←</button><div class="count"><span class="n"></span><span class="bar"><i></i></span></div><button class="arrow" data-d="1" aria-label="${T.nextPage}">→</button>`;view.appendChild(ctl);
  let i=0,side=0,busy=false; // side used on phone: 0 = left page, 1 = right page
  const N=()=>cfg.spreads.length;if(cfg.startLast){i=N()-1;side=1}
  if(cfg.hint)view.insertAdjacentHTML('beforeend',`<div class="swipe-hint"><img class="l" src="m/tex/arrow3.png" alt=""><span class="sig">${T.turnPage}</span><img src="m/tex/arrow3.png" alt=""></div>`);
  function fill(){pl.innerHTML=cfg.spreads[i].L;pr.innerHTML=cfg.spreads[i].R;wire()}
  function wire(){sc.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=e=>{e.stopPropagation();if(Date.now()-moved<500)return;openLB(cfg.zoomList,+el.dataset.zoom)});cfg.wire&&cfg.wire(sc)}
  function pos(){const m=MOB();const tp=cfg.hint?(MOB()?42:104):0;const vw=view.clientWidth,vh=view.clientHeight-70-tp;let s,tx,ty;
    if(!m){s=Math.min(vw/cfg.design[0],vh/cfg.design[1]);tx=(vw-cfg.design[0]*s)/2;ty=tp+Math.max(0,(vh-cfg.design[1]*s)/2)}
    else{const r=side?cfg.pages.R:cfg.pages.L;s=Math.min((vw-24)/r[2],vh/r[3]);tx=(vw-r[2]*s)/2-r[0]*s;ty=tp+Math.max(0,(vh-r[3]*s)/2)-r[1]*s}
    sc.style.transition=cfg._anim?'transform .45s cubic-bezier(.3,.7,.2,1)':'none';sc.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;cfg._anim=false;count();const hh=view.querySelector('.swipe-hint');if(hh)hh.style.top=m?'':Math.max(40,ty+Math.min(cfg.pages.L[1],cfg.pages.R[1])*s-44)+'px'}
  function count(){const m=MOB();const tot=m?N()*2:N();const cur=m?i*2+side+1:i+1;ctl.querySelector('.n').textContent=`${String(cur).padStart(2,'0')} / ${String(tot).padStart(2,'0')}`;ctl.querySelector('i').style.width=(cur/tot*120)+'px';
    ctl.querySelector('[data-d="-1"]').disabled=!cfg.onStart&&cur===1;
    ctl.querySelector('[data-d="1"]').title=cur===tot&&cfg.endLabel?cfg.endLabel:''}
  function flip(dir){if(busy)return;
    let tgt,after=null;
    if(dir>0&&i>=N()-1){if(!cfg.nextSpread){cfg.onEnd&&cfg.onEnd();return}tgt=cfg.nextSpread;after=cfg.onEnd}
    else if(dir<0&&i<=0){if(!cfg.prevSpread){cfg.onStart&&cfg.onStart();return}tgt=cfg.prevSpread;after=cfg.onStart}
    else tgt=cfg.spreads[i+dir];
    busy=true;const fwd=dir>0;const r=fwd?cfg.pages.R:cfg.pages.L;
    const leaf=document.createElement('div');leaf.className='leaf';Object.assign(leaf.style,{left:r[0]+'px',top:r[1]+'px',width:r[2]+'px',height:r[3]+'px',transformOrigin:fwd?'left center':'right center'});
    const next=i+dir;
    leaf.innerHTML=`<div class="face front" style="background:${cfg.leafBg}">${fwd?cfg.spreads[i].R:cfg.spreads[i].L}<div class="shade"></div></div><div class="face back" style="background:${cfg.leafBg}">${fwd?tgt.L:tgt.R}<div class="shade"></div></div>`;
    sc.appendChild(leaf);
    if(fwd)pr.innerHTML=tgt.R;else pl.innerHTML=tgt.L;
    const sh=leaf.querySelectorAll('.shade');const t0=performance.now(),D=750;
    (function step(t){const p=Math.min(1,(t-t0)/D);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;const a=e*180*(fwd?-1:1);
      leaf.style.transform=`rotateY(${a}deg)`;const k=Math.sin(e*Math.PI);
      sh[0].style.background=`linear-gradient(${fwd?90:270}deg,rgba(0,0,0,${.28*k}),rgba(255,255,255,${.12*k}) 55%,rgba(0,0,0,${.08*k}))`;
      sh[1].style.background=`linear-gradient(${fwd?270:90}deg,rgba(0,0,0,${.22*k}),rgba(255,255,255,${.1*k}) 55%,rgba(0,0,0,${.06*k}))`;
      if(p<1)requestAnimationFrame(step);else if(after){after()}else{i=next;fill();leaf.remove();busy=false;
        if(MOB()){side=fwd?0:1;cfg._anim=true}pos()}})(t0);
  }
  function go(dir){if(MOB()){
      if(dir>0&&side===0){side=1;cfg._anim=true;pos();return}
      if(dir<0&&side===1){side=0;cfg._anim=true;pos();return}
    }flip(dir)}
  ctl.addEventListener('click',e=>{if(Date.now()-born<400)return;const b=e.target.closest('[data-d]');if(b)go(+b.dataset.d)});
  // click on page edges
  sc.addEventListener('click',e=>{if(Date.now()-born<600||Date.now()-moved<500)return;if(e.target.closest('[data-zoom],.card,a,button'))return;const r=sc.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;if(MOB()){go(e.clientX>innerWidth/2?1:-1)}else go(x>.5?1:-1)});
  // wheel: one gesture = one page
  const born=Date.now();let lastEv=born,acc=0,fired=true;
  view.addEventListener('wheel',e=>{e.preventDefault();const now=Date.now();if(now-lastEv>200){acc=0;fired=false}lastEv=now;if(fired)return;
    acc+=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(acc)>40){fired=true;go(acc>0?1:-1)}},{passive:false});
  // swipe
  let sx=null,sy=0,moved=0;view.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  view.addEventListener('touchmove',e=>{if(sx==null)return;const t=e.touches[0];if(Math.hypot(t.clientX-sx,t.clientY-sy)>8)moved=Date.now()},{passive:true});
  view.addEventListener('touchend',e=>{if(sx==null)return;if(Date.now()-born<600){sx=null;return}const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.hypot(dx,dy)>8)moved=Date.now();if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)*.7)go(dx<0?1:-1);sx=null},{passive:true});
  fill();pos();
  return {pos,go,key:k=>{if(k==='ArrowRight')go(1);if(k==='ArrowLeft')go(-1)},reset(spreads){cfg.spreads=spreads;i=0;side=0;fill();pos()}};
}

    st.style.left=m?'50%':'52%';const t0=m?52+Math.max(0,(vh-258-H)/3):0;st.style.top=m?(t0+H/2)+'px':'50%';const hh=$('.home-hint',v);hh.style.top=m?(t0+H+34)+'px':'';place()}
  function place(){order.forEach((idx,z)=>{const p=els[idx];p.style.zIndex=50-z;if(p.dataset.out)return;p.style.transform=`translate(${-p.dataset.w/2}px,${-p.dataset.h/2}px) rotate(${z===0?0:rots[idx]}deg)`});
    const top=BY[HOME[order[0]]];$('#hc-t',v).textContent=top.t;$('#hc-b',v).textContent=`${String(order[0]+1).padStart(2,'0')} / ${N} · ${brandLabel(top.b)}`;
    v.querySelectorAll('.home-list a[data-i]').forEach(a=>a.classList.toggle('on',+a.dataset.i===order[0]))}
  let busy=false,pending=null;

    const topIdx=order[0];order=order.filter(x=>x!==k);order.splice(1,0,k);
    place();const p=els[topIdx];p.dataset.out=1;const w=+p.dataset.w,h=+p.dataset.h;

      setTimeout(()=>{busy=false;if(pending!=null){const q=pending;pending=null;bring(q)}},380)},420)}

       <div class="polf" style="position:absolute;left:34%;top:34%;width:56%;transform:rotate(3.5deg)"><img src="m/img/rec-2.jpg" alt="${T.recAlt}"></div>
     </div>
     <div class="rec-sheet">${clip()}
       <h2>${T.recH}</h2>
       <p class="tw" style="font-size:14.5px;line-height:1.65;margin:24px 0 0">${T.recP}</p>
       <div style="margin-top:26px;display:flex;flex-direction:column;gap:12px">${T.stats.map(r=>`<div class="rrow"><span class="n">${r[0]}</span><span class="d"></span><span class="caps">${r[1]}</span></div>`).join('')}</div>
       <a class="caps" href="#film-chanel-cruise-biarritz" style="display:inline-block;margin-top:24px;text-decoration:underline;text-underline-offset:4px">${T.watchFilm}</a>
     </div>
   </div>
   <a class="legal-link caps mute" href="#legal">${T.legal}</a></div>`;
  ACTIVE=null;
}
function vContact(){
  const v=document.createElement('div');v.className='view scrollv';app.appendChild(v);
  const q1=T.q1,q2=T.q2;
  v.innerHTML=`<div class="col" style="max-width:820px"><div class="nbook"><form id="cf" novalidate>
    <div class="sig" style="font-size:clamp(56px,7vw,84px)">${T.talk}</div>
    <p class="tw" style="font-size:15px;margin:10px 0 26px">${T.talkP}</p>
    <div class="caps" style="margin-bottom:10px">${T.need}</div><div class="chips" data-g="1">${q1.map(o=>`<button type="button" class="chip" aria-pressed="false">${o}</button>`).join('')}</div>
    <div id="q2" hidden><div class="caps" style="margin:22px 0 10px">${T.where}</div><div class="chips" data-g="2">${q2.map(o=>`<button type="button" class="chip" aria-pressed="false">${o}</button>`).join('')}</div></div>
    <div class="fld"><label for="c-name">${T.name}</label><input id="c-name" name="name" autocomplete="name" required></div>
    <div class="fld"><label for="c-mail">${T.email}</label><input id="c-mail" name="email" type="email" autocomplete="email" required></div>
    <div class="fld"><label for="c-msg">${T.message}</label><textarea id="c-msg" name="message" required></textarea><input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"></div>
    <div style="margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:18px"><button class="send" type="submit">${T.send}</button><span class="tw" style="font-size:13px">${T.orWrite} <a href="mailto:julie.vaskul@gmail.com" style="text-decoration:underline;text-underline-offset:3px">julie.vaskul@gmail.com</a></span></div>
    <p class="tw mute" id="cf-note" style="font-size:13px;min-height:1.4em" aria-live="polite"></p>
  </form></div><a class="legal-link caps mute" href="#legal">${T.legal}</a></div>`;
  v.querySelectorAll('.chips').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const on=b.getAttribute('aria-pressed')!=='true';g.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',on);if(g.dataset.g==='1')$('#q2',v).hidden=false}));
  $('#cf',v).addEventListener('submit',async e=>{e.preventDefault();const note=$('#cf-note',v),btn=$('.send',v);
    const ok=$('#c-name',v).value.trim()&&/\S+@\S+\.\S+/.test($('#c-mail',v).value)&&$('#c-msg',v).value.trim();if(!ok){note.textContent=T.formMissing;return}
    const pick=g=>{const b=v.querySelector(`.chips[data-g="${g}"] .chip[aria-pressed="true"]`);return b?b.textContent:''};
    const fd=new FormData($('#cf',v));fd.append('need',pick(1));fd.append('usage',pick(2));fd.append('language',LANG);fd.append('_subject','Portfolio enquiry — '+$('#c-name',v).value.trim());
    btn.disabled=true;btn.textContent=T.sending;
    try{const res=await fetch('https://formspree.io/f/mdaryzqg',{method:'POST',body:fd,headers:{Accept:'application/json'}});
      if(res.ok){$('#cf',v).querySelectorAll('.fld,.chips,#q2,.caps').forEach(n=>n.remove());btn.remove();note.classList.remove('mute');note.style.fontSize='16px';note.textContent=T.formOk;track('contact_sent',{need:pick(1)})}
      else throw 0}catch(_){note.textContent=T.formErr;btn.disabled=false;btn.textContent=T.send}});
  ACTIVE=null;
}

  const v=document.createElement('div');v.className='view scrollv';app.appendChild(v);
  const fr=LANG==='fr',k=fr?' :':':';
  v.innerHTML=`<div class="col" style="max-width:820px"><div class="nbook legal">
   <div class="sig" style="font-size:clamp(48px,6vw,72px)">${fr?'Mentions légales':'Legal notice'}</div>
   <h3 class="caps">${fr?'Éditrice du site':'Site publisher'}</h3>
   <p>Julia Vaskul<br>
   ${fr?'Adresse':'Address'}${k} Hendaye, France<br>
   ${fr?'Contact':'Contact'}${k} <a href="mailto:julie.vaskul@gmail.com">julie.vaskul@gmail.com</a><br>
   ${fr?'Directrice de la publication':'Publication director'}${k} Julia Vaskul</p>
   <h3 class="caps">${fr?'Hébergement':'Hosting'}</h3>
   <p>GitHub, Inc. (GitHub Pages) — 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA — github.com</p>
   <h3 class="caps">${fr?'Propriété intellectuelle':'Intellectual property'}</h3>
   <p>${fr?'Les images et films présentés sont des créations conceptuelles indépendantes, entièrement générées par IA. Les marques citées appartiennent à leurs propriétaires respectifs ; leur mention n’implique aucun partenariat ni commande. Toute reproduction des contenus sans autorisation est interdite.':'The images and films shown are independent conceptual work, fully AI-generated. Brands mentioned belong to their respective owners; their mention implies no partnership or commission. Reproduction of the content without permission is prohibited.'}</p>
   <h3 class="caps">${fr?'Données personnelles':'Personal data'}</h3>
   <p>${fr?'Le formulaire de contact transmet votre nom, votre e-mail et votre message via Formspree (formspree.io), uniquement pour vous répondre. Avec votre accord, des statistiques de visite et des enregistrements de navigation anonymes (champs de formulaire masqués) sont réalisés avec PostHog (serveurs dans l’UE), conservés 30 jours pour les enregistrements. Vous pouvez demander l’accès à vos données ou leur suppression à julie.vaskul@gmail.com.':'The contact form sends your name, email and message through Formspree (formspree.io), only to reply to you. With your consent, visit statistics and anonymous session recordings (form fields masked) are collected with PostHog (EU servers); recordings are kept for 30 days. You can ask to access or delete your data at julie.vaskul@gmail.com.'}</p>
   ${POSTHOG_KEY?`<p><button class="caps" id="consent-reset" style="text-decoration:underline;text-underline-offset:3px">${fr?'Modifier mon choix de cookies':'Change my cookie choice'}</button></p>`:''}
  </div></div>`;
  const cr=$('#consent-reset',v);if(cr)cr.onclick=()=>{try{localStorage.removeItem('jv-consent')}catch(e){}location.reload()};
  ACTIVE=null;
}

/* ================= router ================= */
const firstUrls=o=>[`m/dip/${o.d}_diptych-1.jpg`,`m/dip/${o.d}_diptych-2.jpg`,img(o.s,o.fr[0])];
function whenLoaded(urls,max){return Promise.race([Promise.all(urls.map(u=>new Promise(z=>{const i=new Image();i.onload=i.onerror=()=>z();i.src=u;if(i.complete)z()}))),new Promise(z=>setTimeout(z,max))])}
let RT=0;
function route(){
  const h0=location.hash.slice(1);const x0=h0.startsWith('p-')&&BY[h0.slice(2)];
  if(MOB()&&x0&&x0.c!=='film'){const t=++RT;whenLoaded(firstUrls(x0),1800).then(()=>{if(t===RT)_route()});return}
  RT++;_route();
}
function _route(){
  $('.lbx')?.remove();$('.proj')?.remove();LB=null;$('#menu').hidden=true;
  app.innerHTML='';ACTIVE=null;
  const h=location.hash.slice(1)||'about';let r=h;
  if(h==='about'||h==='home')vAbout(),r='about';
  else if(h==='fashion')vHome('fashion');
  else if(h==='beauty')vHome('beauty');
  else if(h==='film')vFilm();
  else if(h.startsWith('film-'))vFilm(h.slice(5)),r='film';
  else if(h.startsWith('p-')&&BY[h.slice(2)]){const x=BY[h.slice(2)];if(x.c==='film'){vFilm(x.s);r='film'}else{vProject(x);r=x.c}}
  else if(h==='contact')vContact();
  else if(h==='legal')vLegal(),r='';
  else {vAbout();r='about'}
  document.querySelectorAll('.nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  track('$pageview',{$current_url:location.href,section:r||h});
}
let lastHash=location.hash;
addEventListener('hashchange',()=>{if(location.hash===lastHash)return;lastHash=location.hash;route()});
const _rs=history.replaceState.bind(history);history.replaceState=(a,b,u)=>{_rs(a,b,u);lastHash=location.hash};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>ACTIVE&&ACTIVE.pos&&ACTIVE.pos(),120)});
addEventListener('keydown',e=>{if($('.lbx')){if(e.key==='Escape'){LB=null;$('.lbx').remove()}if(e.key==='ArrowRight'&&LB){LB.i=(LB.i+1)%LB.list.length;drawLB()}if(e.key==='ArrowLeft'&&LB){LB.i=(LB.i-1+LB.list.length)%LB.list.length;drawLB()}return}if($('.proj'))return;!e.repeat&&ACTIVE&&ACTIVE.key&&ACTIVE.key(e.key)});
$('#menuBtn').onclick=()=>{const m=$('#menu');m.hidden=!m.hidden;$('#menuBtn').setAttribute('aria-expanded',!m.hidden)};
document.querySelectorAll('.lang-b').forEach(b=>b.addEventListener('click',()=>{$('#menu').hidden=true;setLang(LANG==='en'?'fr':'en')}));
$('#menu').addEventListener('click',e=>{if(e.target.closest('a'))$('#menu').hidden=true});
applyChrome();cookieBanner();
route();
</script>
